<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Audion DPI Manager — Rounded Connection</title>
  <desc>Two offset blue contacts with rounded corners, connected by a Burnt Orange bridge with smooth rounded bends. The selected B composition and gradients are preserved.</desc>
  <defs>
    <linearGradient id="tile" x1="100" y1="0" x2="924" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26334C"/>
      <stop offset=".5" stop-color="#151D31"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <linearGradient id="blue" x1="176" y1="240" x2="848" y2="784" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65E6FF"/>
      <stop offset=".5" stop-color="#18B6EE"/>
      <stop offset="1" stop-color="#147BE8"/>
    </linearGradient>
    <linearGradient id="burnt" x1="300" y1="350" x2="724" y2="674" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EE894A"/>
      <stop offset=".5" stop-color="#CC5500"/>
      <stop offset="1" stop-color="#A63B19"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
  <g id="restored-connection">
    <path id="burnt-orange-bridge" d="M348 364H434Q474 364 496.6 397L577.4 515Q600 548 640 548H676V660H588Q548 660 525.4 627L444.6 509Q422 476 382 476H348Z" fill="url(#burnt)"/>
    <rect id="left-contact" x="196" y="300" width="184" height="240" rx="40" fill="url(#blue)"/>
    <rect id="right-contact" x="644" y="484" width="184" height="240" rx="40" fill="url(#blue)"/>
  </g>
</svg>
